apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels: {{- include "obs.labels" "prometheus" | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels: {{- include "obs.labels" "prometheus" | nindent 4 }}
data:
  prometheus.yml: |
{{ include "obs.prometheus.config" . | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  labels: {{- include "obs.labels" "prometheus" | nindent 4 }}
data:
{{ (.Files.Glob "files/prometheus/*.yml").AsConfig | indent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: {{- include "obs.labels" "prometheus" | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "obs.selector" "prometheus" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "obs.labels" "prometheus" | nindent 8 }}
      annotations:
        checksum/config: {{ include "obs.prometheus.config" . | sha256sum }}
        checksum/rules: {{ (.Files.Glob "files/prometheus/*.yml").AsConfig | sha256sum }}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: {{ .Values.images.prometheus }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
            - --web.enable-lifecycle
            - --web.enable-remote-write-receiver
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
            - { name: rules, mountPath: /etc/prometheus/rules }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: rules
          configMap: { name: prometheus-rules }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: {{- include "obs.labels" "prometheus" | nindent 4 }}
spec:
  type: NodePort
  selector: {{- include "obs.selector" "prometheus" | nindent 4 }}
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: {{ .Values.nodePorts.prometheus }}
