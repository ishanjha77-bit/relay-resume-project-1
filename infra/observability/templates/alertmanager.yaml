apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  labels: {{- include "obs.labels" "alertmanager" | nindent 4 }}
data:
  alertmanager.yml: |
{{ include "obs.alertmanager.config" . | indent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-webhook
  labels: {{- include "obs.labels" "alertmanager" | nindent 4 }}
type: Opaque
stringData:
  webhook-token: {{ .Values.alertmanager.webhookToken | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels: {{- include "obs.labels" "alertmanager" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "obs.selector" "alertmanager" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "obs.labels" "alertmanager" | nindent 8 }}
      annotations:
        checksum/config: {{ include "obs.alertmanager.config" . | sha256sum }}
    spec:
      containers:
        - name: alertmanager
          image: {{ .Values.images.alertmanager }}
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager/alertmanager.yml, subPath: alertmanager.yml }
            - { name: secrets, mountPath: /etc/alertmanager/secrets, readOnly: true }
            - { name: data, mountPath: /alertmanager }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
        - name: secrets
          secret: { secretName: alertmanager-webhook }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  labels: {{- include "obs.labels" "alertmanager" | nindent 4 }}
spec:
  type: NodePort
  selector: {{- include "obs.selector" "alertmanager" | nindent 4 }}
  ports:
    - name: http
      port: 9093
      targetPort: http
      nodePort: {{ .Values.nodePorts.alertmanager }}
