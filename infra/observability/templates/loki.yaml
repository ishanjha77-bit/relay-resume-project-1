apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  labels: {{- include "obs.labels" "loki" | nindent 4 }}
data:
  loki.yaml: |
{{ include "obs.loki.config" . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels: {{- include "obs.labels" "loki" | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "obs.selector" "loki" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "obs.labels" "loki" | nindent 8 }}
      annotations:
        checksum/config: {{ include "obs.loki.config" . | sha256sum }}
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: loki
          image: {{ .Values.images.loki }}
          args: [-config.file=/etc/loki/loki.yaml, -target=all]
          ports:
            - name: http
              containerPort: 3100
            - name: grpc
              containerPort: 9095
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels: {{- include "obs.labels" "loki" | nindent 4 }}
spec:
  type: NodePort
  selector: {{- include "obs.selector" "loki" | nindent 4 }}
  ports:
    - name: http
      port: 3100
      targetPort: http
      nodePort: {{ .Values.nodePorts.loki }}
    - name: grpc
      port: 9095
      targetPort: grpc
