apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  labels: {{- include "obs.labels" "otel-collector" | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-otel-collector
rules:
  # k8sattributes: map log files and span sources to pods, deployments, labels.
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets, deployments]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels: {{- include "obs.labels" "otel-collector" | nindent 4 }}
data:
  collector.yaml: |
{{ include "obs.collector.config" . | indent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  labels: {{- include "obs.labels" "otel-collector" | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "obs.selector" "otel-collector" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "obs.labels" "otel-collector" | nindent 8 }}
      annotations:
        checksum/config: {{ include "obs.collector.config" . | sha256sum }}
    spec:
      serviceAccountName: otel-collector
      securityContext:
        runAsUser: 0   # pod log files on the node are root-readable only
      containers:
        - name: otel-collector
          image: {{ .Values.images.otelCollector }}
          args: [--config=/etc/otelcol/collector.yaml]
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol }
            - { name: varlogpods, mountPath: /var/log/pods, readOnly: true }
      volumes:
        - name: config
          configMap: { name: otel-collector-config }
        - name: varlogpods
          hostPath: { path: /var/log/pods }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels: {{- include "obs.labels" "otel-collector" | nindent 4 }}
spec:
  selector: {{- include "obs.selector" "otel-collector" | nindent 4 }}
  internalTrafficPolicy: Local
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
