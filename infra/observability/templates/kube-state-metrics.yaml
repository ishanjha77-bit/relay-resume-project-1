apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  labels: {{- include "obs.labels" "kube-state-metrics" | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-kube-state-metrics
rules:
  # Only the resources passed to --resources below; no secrets, no configmaps.
  - apiGroups: [""]
    resources: [pods, nodes, namespaces]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  labels: {{- include "obs.labels" "kube-state-metrics" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "obs.selector" "kube-state-metrics" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "obs.labels" "kube-state-metrics" | nindent 8 }}
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: {{ .Values.images.kubeStateMetrics }}
          args:
            - --resources=pods,nodes,namespaces,deployments,replicasets,statefulsets,daemonsets
            - --metric-labels-allowlist=pods=[app.kubernetes.io/name,app.kubernetes.io/version],deployments=[app.kubernetes.io/name]
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  labels: {{- include "obs.labels" "kube-state-metrics" | nindent 4 }}
spec:
  selector: {{- include "obs.selector" "kube-state-metrics" | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
