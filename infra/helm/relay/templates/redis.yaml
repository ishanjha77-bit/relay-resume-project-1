apiVersion: v1
kind: Service
metadata:
  name: relay-redis
  labels: {{- include "relay.labels" "relay-redis" | nindent 4 }}
spec:
  type: NodePort
  selector: {{- include "relay.selector" "relay-redis" | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      nodePort: {{ .Values.nodePorts.redis }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: relay-redis
  labels: {{- include "relay.labels" "relay-redis" | nindent 4 }}
spec:
  serviceName: relay-redis
  replicas: 1
  selector:
    matchLabels: {{- include "relay.selector" "relay-redis" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "relay.labels" "relay-redis" | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: {{ .Values.images.redis }}
          # The streams are the system's message log: persist them (AOF) and
          # never evict a key; a full Redis refuses writes instead.
          args: [--appendonly, "yes", --maxmemory, 200mb, --maxmemory-policy, noeviction]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
