# Every push and pull request: lint and test every language, check the charts, build the images.
# The Python and Java suites start real Postgres/Redis containers (Testcontainers) on the
# runner's Docker; the console's end-to-end tests run against recorded API responses.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python · agent service, MCP servers, evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Includes the golden-trace replays (a recorded investigation must still reach its
      # verdict) and the contract tests against contracts/schemas.
      - run: uv run pytest

  java:
    name: Java · ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [apps/platform-api, sandbox/services/orders, sandbox/services/inventory]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: sh ./mvnw -B -q test
        working-directory: ${{ matrix.project }}

  go:
    name: Go · sandbox services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: sandbox/services/*/go.sum
      - run: for m in golib gateway payments; do (cd "sandbox/services/$m" && go vet ./... && go test ./...); done

  typescript:
    name: TypeScript · k8s MCP server, console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: k8s MCP server
        working-directory: mcp-servers/k8s-readonly
        run: npm ci && npm run lint && npm test
      - name: Console · lint and types
        working-directory: apps/console
        run: npm ci && npm run lint && npx next typegen && npx tsc --noEmit
      - name: Console · end to end (Chromium, axe)
        working-directory: apps/console
        run: npx playwright install --with-deps chromium && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/console/test-results/

  charts:
    name: Helm charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint infra/helm/relay infra/helm/sandbox infra/observability
      - run: |
          helm template relay infra/helm/relay --namespace relay > /dev/null
          helm template sandbox infra/helm/sandbox --namespace sandbox > /dev/null

  images:
    name: Images
    runs-on: ubuntu-latest
    needs: [python, java, typescript]
    steps:
      - uses: actions/checkout@v4
      - run: for svc in platform-api agent-service mcp-logs mcp-metrics mcp-k8s mcp-runbooks mcp-github console; do make relay-image svc=$svc; done
