[project]
name = "relay-mcp-metrics-prometheus"
version = "0.1.0"
description = "MCP server: read-only metrics, alerts and service topology from Prometheus."
requires-python = ">=3.12"
dependencies = [
    "relay-mcp-kit",
    "httpx2>=2.13",
]

[project.scripts]
relay-mcp-metrics-prometheus = "metrics_prometheus.server:main"

[tool.uv.sources]
relay-mcp-kit = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metrics_prometheus"]
