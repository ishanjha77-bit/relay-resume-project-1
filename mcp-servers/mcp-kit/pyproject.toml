[project]
name = "relay-mcp-kit"
version = "0.1.0"
description = "Shared plumbing for Relay's Python MCP servers: auth, health checks, output shaping."
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "uvicorn>=0.54",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_mcp_kit"]
