id: config-error
title: Inventory points at a database host that doesn't exist; new pods crash-loop
chaos: config-error              # sandbox/chaos/config-error.sh
expected:
  category: [config_error]   # top hypothesis category must be one of these
  service: [inventory]    # ...and its service one of these
  fix: "Revert DB_URL to postgres:5432 (roll back the config change)."
